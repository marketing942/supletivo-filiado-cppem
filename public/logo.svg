  <!-- Left eye -->
  <ellipse cx="60" cy="88" rx="11" ry="13" fill="white"/>
  <ellipse cx="60" cy="88" rx="6" ry="8" fill="#39FF14"/>

  <!-- Right eye -->
  <ellipse cx="100" cy="88" rx="11" ry="13" fill="white"/>
