<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Background square (optional, remove if you want transparent) -->
  <rect width="160" height="160" rx="32" fill="#05080A"/>

  <!-- Main heart/teardrop body (scaled/shifted to fit square) -->
  <path d="M80 138
    C64 122 24 102 18 74
    C12 48 26 26 46 22
    C55 19 64 24 68 30
    C70 24 76 19 80 17
    C84 19 90 24 92 30
    C96 24 105 19 114 22
    C134 26 148 48 142 74
    C136 102 96 122 80 138Z"
    fill="#39FF14"/>

  <!-- Left horn -->
  <path d="M46 24 C40 13 27 10 22 17 C18 24 28 33 39 30 C43 29 46 26 46 24Z"
    fill="#39FF14"/>
  <!-- Right horn -->
  <path d="M114 24 C120 13 133 10 138 17 C142 24 132 33 121 30 C117 29 114 26 114 24Z"
    fill="#39FF14"/>

  <!-- Crown arc -->
  <path d="M45 70 Q80 55 115 70" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Left mane lines -->
  <path d="M28 96 Q20 77 30 60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M35 112 Q24 90 30 72" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Right mane lines -->
  <path d="M132 96 Q140 77 130 60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M125 112 Q136 90 130 72" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Left eye -->
  <ellipse cx="60" cy="84" rx="11" ry="13" fill="white"/>
  <ellipse cx="60" cy="84" rx="6" ry="8" fill="#39FF14"/>
  <!-- Right eye -->
  <ellipse cx="100" cy="84" rx="11" ry="13" fill="white"/>
  <ellipse cx="100" cy="84" rx="6" ry="8" fill="#39FF14"/>

  <!-- Nose -->
  <path d="M71 103 Q80 112 89 103 L86 99 Q80 106 74 99Z" fill="white"/>

  <!-- Mouth -->
  <path d="M70 116 Q80 125 90 116" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
